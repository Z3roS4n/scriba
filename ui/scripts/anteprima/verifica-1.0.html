<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Scriba — verifica della sostituzione</title>
    <link rel="stylesheet" href="../../renderer/tokens.css" />
    <link rel="stylesheet" href="../../renderer/app.css" />
    <link rel="stylesheet" href="../../renderer/shell.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="ponte-finto.js"></script>
    <script src="../../dist/renderer/bundle.js"></script>
    <script>
      // Non un giudizio a occhio: si chiede al browser quali classi presenti
      // nel DOM non trovano NESSUNA regola nei fogli caricati. È l'elenco di
      // ciò che resta da migrare, misurato sul rendering vero invece che
      // dedotto con un'espressione regolare.
      window.__misura = () => {
        const inCss = new Set()
        for (const foglio of document.styleSheets) {
          let regole
          try { regole = foglio.cssRules } catch { continue }
          const raccogli = (lista) => {
            for (const r of lista) {
              if (r.selectorText) {
                for (const m of r.selectorText.matchAll(/\.([a-zA-Z][\w-]*)/g)) inCss.add(m[1])
              }
              if (r.cssRules) raccogli(r.cssRules)
            }
          }
          raccogli(regole)
        }
        const nelDom = new Map()
        for (const el of document.querySelectorAll('*')) {
          for (const c of el.classList) nelDom.set(c, (nelDom.get(c) || 0) + 1)
        }
        const scoperte = [...nelDom.entries()].filter(([c]) => !inCss.has(c)).sort((a, b) => b[1] - a[1])
        const corpo = getComputedStyle(document.body)
        return {
          font: corpo.fontFamily,
          classiNelDom: nelDom.size,
          senzaRegola: scoperte.length,
          elenco: scoperte.map(([c, n]) => `${c} ×${n}`),
        }
      }
    </script>
  </body>
</html>
