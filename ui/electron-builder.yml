# Configurazione di electron-builder: pacchetto Windows installabile di Scriba.
#
# Un file YAML separato invece di un campo "build" dentro package.json: tiene
# i dettagli di packaging (icone, extraResources, target NSIS) lontani dagli
# script npm, che restano leggibili. electron-builder lo trova da solo perche'
# sta accanto a package.json e non c'e' nessun campo "build" li' dentro.
#
# Spiegazione di ogni scelta in .claude/project/10-packaging.md.

appId: it.scriba.app
productName: Scriba
copyright: Copyright (c) 2026 Scriba

directories:
  output: release
  buildResources: build-resources

# Il renderer e' gia' un bundle autosufficiente: esbuild lo impacchetta,
# React compreso (vedi lo script "build:renderer" in package.json). Al
# processo principale, a runtime, node_modules non serve: si esclude per
# intero invece di lasciare che electron-builder porti dentro anche i
# devDependencies di sviluppo (typescript, esbuild, e Electron stesso, che
# electron-builder sostituisce comunque con il proprio binario scaricato).
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
  - "!node_modules"
  - "!**/*.map"

extraResources:
  # L'eseguibile del core, prodotto da PyInstaller in modalita' onedir (vedi
  # scripts/pyinstaller/scriba_core.spec). sidecar.ts lo cerca in
  # `resources/core-dist/scriba_core/scriba_core.exe`: risalendo di una
  # cartella da `app.getAppPath()` pacchettizzato si arriva esattamente in
  # `resources/`, che e' dove electron-builder copia questa cartella.
  - from: ../dist/core/scriba_core
    to: core-dist/scriba_core
  # L'icona serve anche a runtime, non solo all'eseguibile: la finestra e
  # l'area di notifica se la caricano da un file. Stessa risalita di
  # core-dist — da `app.getAppPath()` pacchettizzato si arriva in
  # `resources/`, quindi `resources/assets/scriba.ico`. In sviluppo lo
  # stesso percorso relativo cade sulla cartella `assets/` del repository:
  # una riga sola in `main/index.ts` copre tutti e due i casi.
  - from: ../assets
    to: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../assets/scriba.ico
  # Nessuna firma del codice: decisione presa all'inizio del progetto, che e'
  # personale e open source. Windows mostrera' l'avviso di SmartScreen alla
  # prima apertura — e' un compromesso accettato, non un difetto da
  # "aggiustare" con un certificato self-signed (che non toglie l'avviso e
  # aggiunge solo un altro segreto da gestire).
  #
  # Quella scelta pero' NON si esprime con `signAndEditExecutable: false`, che
  # e' quello che c'era scritto qui prima. Quell'opzione non spegne solo la
  # firma: spegne l'intero passaggio che riscrive l'eseguibile, e quel
  # passaggio e' anche l'unico che ci mette dentro icona, nome e versione.
  # Con `false` l'exe restava con l'icona di Electron e senza identita' in
  # Gestione attivita' — il `icon:` qui sopra veniva ignorato.
  #
  # Con `true` (il predefinito) electron-builder scrive icona e metadati, e
  # firma soltanto se trova un certificato configurato. Non essendocene
  # nessuno, non firma: la decisione di partenza resta intatta.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Scriba

  # La grafica sta in `build-resources/` (vedi directories.buildResources) e
  # electron-builder la prende per convenzione dai nomi dei file: bastano
  # installerHeader.bmp, installerSidebar.bmp, uninstallerSidebar.bmp e le due
  # icone. Si rigenera con scripts/genera-grafica-installer.ps1, che spiega
  # anche perche' i BMP sono a 24 bit e perche' l'intestazione e' chiara mentre
  # il pannello laterale e' scuro.
  #
  # Le due icone si dichiarano lo stesso, per non dipendere solo dalla
  # convenzione: sono quello che si vede prima di tutto il resto, cioe' sul
  # file scaricato — e questo installer non e' firmato, quindi arriva dopo
  # l'avviso di SmartScreen, nel momento in cui uno si sta chiedendo se
  # fidarsi.
  installerIcon: build-resources/installerIcon.ico
  uninstallerIcon: build-resources/uninstallerIcon.ico
  # L'icona nell'angolo dell'intestazione, accanto al titolo di ogni pagina.
  installerHeaderIcon: build-resources/installerIcon.ico

  # La licenza si mostra: e' MIT, si legge in un minuto, e dice a chi installa
  # che cosa gli si sta dando. Il file lo prepara lo script della grafica
  # copiando LICENSE, cosi' non ne esistono due versioni che divergono.
  license: build-resources/license.txt
  # I dati dell'utente (registrazioni, database, screenshot, impostazioni)
  # stanno in app.getPath('userData'), fuori dalla cartella di installazione:
  # un disinstallatore che cancella quest'ultima non li tocca. Questa opzione
  # e' comunque esplicita, cosi' resta scritto nero su bianco che e' una
  # scelta e non una dimenticanza — vedi la verifica in 10-packaging.md.
  deleteAppDataOnUninstall: false
